experiment:
  name: tandt_train
  output_root: output/tandt_train

dataset:
  source_path: /lfs3/users/spsong/dataset/tandt/train
  images: images
  depths: ""
  resolution: -1
  white_background: false
  train_test_exp: false
  data_device: cpu
  camera_load_workers: 8
  image_load_mode: dataloader
  image_loader_seed: 42
  max_cache_num: 301
  image_cache_workers: 8
  eval: true

model:
  sh_degree: 3

pipeline:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false
  antialiasing: false

optimization:
  iterations: 30000
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.025
  scaling_lr: 0.005
  rotation_lr: 0.001
  exposure_lr_init: 0.01
  exposure_lr_final: 0.001
  exposure_lr_delay_steps: 0
  exposure_lr_delay_mult: 0.0
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  depth_l1_weight_init: 1.0
  depth_l1_weight_final: 0.01
  random_background: false
  optimizer_type: default

logging:
  swanlab_project: block-gs
  swanlab_workspace: ""
  swanlab_mode: cloud
  swanlab_logdir: ""
  swanlab_experiment_prefix: tandt_train
  swanlab_experiment_name: tandt_train

training:
  model_path: output/tandt_train
  ip: 127.0.0.1
  port: 6009
  debug_from: -1
  detect_anomaly: false
  quiet: false
  disable_viewer: false

block_training:
  test_iterations: [7000, 30000]
  save_iterations: [30000]
  checkpoint_iterations: [30000]
  start_checkpoint:

render:
  model_path: output/tandt_train
  source_path: /lfs3/users/spsong/dataset/tandt/train
  images: images
  depths: ""
  iteration: 30000
  skip_train: true
  skip_test: false
  quiet: false

metrics:
  model_paths: [output/tandt_train]
