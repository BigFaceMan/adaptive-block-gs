experiment:
  name: mc_aerial_recursive_d2_c4_depth
  output_root: output/mc_aerial_recursive_d2_c4_depth

dataset:
  source_path: /lfs3/users/spsong/dataset/MatrixCity/small_city/aerial/train/block_all
  images: input
  depths: depths_any
  test_source_path: /lfs3/users/spsong/dataset/MatrixCity/small_city/aerial/test/block_all_test
  test_images: input
  test_depths: ""
  resolution: -1
  white_background: false
  train_test_exp: false
  data_device: cpu
  image_loader_seed: 42
  max_cache_num: 512
  image_cache_workers: 8
  eval: false

model:
  sh_degree: 3
  coarse_model: /lfs1/users/spsong/Code/project/adaptive-block-gs/output/mc_aerial_coarse_depth_30000/point_cloud/iteration_30000/point_cloud.ply

pipeline:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false
  antialiasing: false

optimization:
  iterations: 30000
  position_lr_init: 0.000064
  position_lr_final: 0.00000064
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.004
  rotation_lr: 0.001
  exposure_lr_init: 0.01
  exposure_lr_final: 0.001
  exposure_lr_delay_steps: 0
  exposure_lr_delay_mult: 0.0
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 200
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  depth_l1_weight_init: 1.0
  depth_l1_weight_final: 0.01
  depth_reg_mask_mode: block_projection
  depth_reg_mask_bbox_mode: expanded
  depth_reg_mask_dilate_px: 16
  depth_reg_mask_min_pixels: 2048
  depth_reg_mask_max_points: 100000
  depth_reg_mask_cache: true
  depth_reg_mask_cache_max_items: 0
  random_background: false
  optimizer_type: default

logging:
  swanlab_project: block-gs
  swanlab_workspace: ""
  swanlab_mode: cloud
  swanlab_logdir: ""
  swanlab_experiment_prefix: mc_aerial_recursive_d2_c4_depth

training:
  ip: 127.0.0.1
  port: 6009
  debug_from: -1
  detect_anomaly: false
  quiet: false
  disable_viewer: false

partition:
  output_path: ${experiment.output_root}/partitions
  coord_space: contracted
  contract_aabb: [-3.5, -4, -10, 4.5, 2, 10]
  axes: [x, y]
  max_depth: 2
  max_blocks: 4
  max_block_importance: 0.0
  max_block_density: 0.0
  min_points: 50000
  min_size: 0.0
  expand_ratio: 0.0
  num_split_candidates: 64
  lambda_boundary: 0.2
  importance: opacity_scale

camera_assignment:
  tau_projection: 0.8
  tau_test_projection: 0.02
  min_cameras: 20
  min_test_cameras: 20
  supplement_cameras: true
  projection_max_points: 5000
  render_difference:
    enabled: true
    threshold: 0.03
    max_candidates_per_block: 0
    max_width: 800
    cache_full: false

visualization:
  visualize_blocks: false
  visualize_topdown: true
  visualize_topdown_output: ""
  visualize_topdown_max_points: 0
  visualize_topdown_image_size: 4096
  visualize_topdown_point_radius: 0
  visualize_topdown_bbox_mode: both
  visualize_topdown_clip_percentile: 0.2
  visualize_topdown_color: auto
  visualize_topdown_keep: max

block_training:
  blocks_root: ${experiment.output_root}/blocks
  partition_path: ${partition.output_path}/partition_tree.json
  partition_bbox_mode: core
  partition_init_mode: coarse
  partition_load_test_cameras: false
  test_iterations: [7000, 30000]
  save_iterations: [30000]
  checkpoint_iterations: [30000]

merge:
  partition_path: ${block_training.partition_path}
  blocks_root: ${block_training.blocks_root}
  iteration: 30000
  output_path: ${experiment.output_root}/merged
  allow_missing: false
  cfg_args_source: ""

render:
  model_path: ${merge.output_path}
  source_path: ${dataset.test_source_path}
  images: ${dataset.test_images}
  depths: ${dataset.test_depths}
  iteration: 30000
  skip_train: false
  skip_test: true
  quiet: false

metrics:
  model_paths: ["${merge.output_path}"]
